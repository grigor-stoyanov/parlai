[project]
name = "parlai"
version = "0.1.0"
description = "Local voice interface for talking to AI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/speech_to_text",
    "src/event_bus",
    "src/text_delivery",
    "src/text_to_speech",
    "src/ai_output_capture",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
# Root on the path so tests can import main.py.
pythonpath = ["."]
