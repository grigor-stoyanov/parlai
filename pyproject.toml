[project]
name = "parlai"
version = "0.1.0"
description = "Local voice interface for talking to AI"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper~=1.2.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
]

[project.optional-dependencies]
# NVIDIA's CUDA 12 libraries, only needed to run Whisper on an NVIDIA GPU: uv sync --extra cuda
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'linux' or sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/config",
    "src/speech_to_text",
    "src/sound_utils",
    "src/event_bus",
    "src/event_logger",
    "src/text_delivery",
    "src/text_to_speech",
    "src/ai_output_capture",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
# Root on the path so tests can import main.py.
pythonpath = ["."]
